stages:
  - test_and_build

variables:
    GIT_STRATEGY: clone
    GIT_SUBMODULE_STRATEGY: recursive
    SCALENODE_CPU: 4
    SCALENODE_RAM: 8192
    SCALENODE_DISK: 15

image: debian:bookworm

test:
  variables:
    SCALENODE_RAM: 16384
  stage: test_and_build
  tags: ["ace-x86_64"]
  script:
    - apt-get -y update
    - apt-get -y upgrade

    # Install dependencies
    - apt-get -fy install python3 python3-pip python3-venv git build-essential make curl flex bison zlib1g-dev
    - python3 -m venv env
    - source ./env/bin/activate
    - pip3 install -r requirements.txt
    - apt-get install -y autoconf gperf perl autoconf ccache libgoogle-perftools-dev numactl perl-doc libfl2 libfl-dev help2man

    # Install icarus verilog
    - git clone https://github.com/verilator/verilator && cd verilator
    - git checkout master
    - autoconf
    - ./configure
    - make -j $(nproc)
    - make install
    - cd ..

    # Run tests
    - TRACE=1 make tests | tee log.txt
    - '! cat $(find . -name "results.xml") | grep -cq "<failure />"'
  artifacts:
    when: always
    name: tests
    expire_in: 2 weeks
    paths:
      - log.txt
      - results.xml
      - tests/build/

bitstream:
  stage: test_and_build
  tags: ["ace-x86_64"]
  script:
    - apt-get -y update
    - apt-get -y upgrade

    # Install dependencies
    - apt-get -fy install python3 python3-pip python3-venv git build-essential make curl flex bison zlib1g-dev
    - python3 -m venv env
    - source ./env/bin/activate
    - pip3 install -r requirements.txt
    - apt-get -fy install clang libreadline-dev gawk tcl-dev libffi-dev git
        graphviz xdot pkg-config libboost-all-dev cmake libeigen3-dev tclsh ant
        default-jre swig google-perftools python3-dev uuid uuid-dev libfl-dev wget

    # Define CI‑portable tools prefix
    - export TOOLS_PREFIX=/opt/fpga-tools
    - mkdir -p $TOOLS_PREFIX/bin
    - export PATH=$TOOLS_PREFIX/bin:$PATH

    # Install Rust
    - curl https://sh.rustup.rs -sSf | sh -s -- -y
    - source "$HOME/.cargo/env"

    # Build & install Synlig (Yosys with SystemVerilog) to prefix
    - git clone https://github.com/chipsalliance/synlig.git && cd synlig
    - pip3 install orderedmultidict --break-system-packages
    - git submodule sync
    - git submodule update --init --recursive third_party/{surelog,yosys}
    - make install -j $(nproc) PREFIX=$TOOLS_PREFIX
    - ln -s $TOOLS_PREFIX/bin/synlig $TOOLS_PREFIX/bin/yosys   # make `yosys` available
    - cd ..

    # Build & install prjoxide
    - git clone --recursive https://github.com/gatecat/prjoxide && cd prjoxide
    - cd libprjoxide
    - cargo install --path prjoxide
    - cd ../..

    # Build & install nextpnr-nexus to prefix
    - git clone https://github.com/YosysHQ/nextpnr.git && cd nextpnr
    - mkdir -p build && cd build
    - cmake .. -DARCH=nexus -DOXIDE_INSTALL_PREFIX="$HOME/.cargo"
    - cmake --build . -j$(nproc)
    - cmake --install . --prefix $TOOLS_PREFIX   # install into /opt/fpga-tools/bin
    - cd ../..

    # Build the bitstreams
    - LANES=2 VIDEO_FORMAT=720p60 NEXTPNR_ARGS="--placer-heap-timingweight 50" make all
    - LANES=2 VIDEO_FORMAT=1080p30 NEXTPNR_ARGS="--placer-heap-timingweight 50" make -B all
    - LANES=2 VIDEO_FORMAT=1080p60 NEXTPNR_ARGS="--placer-heap-timingweight 50" make -B all
    - PATTERN_GEN=1 LANES=2 VIDEO_FORMAT=720p60 NEXTPNR_ARGS="--placer-heap-timingweight 50" make -B all
    - PATTERN_GEN=1 LANES=2 VIDEO_FORMAT=1080p30 NEXTPNR_ARGS="--placer-heap-timingweight 50" make -B all
    - PATTERN_GEN=1 LANES=2 VIDEO_FORMAT=1080p60 NEXTPNR_ARGS="--placer-heap-timingweight 50" make -B all
  artifacts:
    name: bitstream-build
    expire_in: 2 weeks
    paths:
      - build/
